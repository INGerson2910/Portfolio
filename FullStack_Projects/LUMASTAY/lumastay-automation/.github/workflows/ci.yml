name: LumaStay Automation Tests

on:
  push:
    paths:
      - 'FullStack_Projects/LUMASTAY/lumastay-automation/**'
  pull_request:
    paths:
      - 'FullStack_Projects/LUMASTAY/lumastay-automation/**'
  workflow_dispatch:
    inputs:
      suite:
        description: 'TestNG suite to run'
        required: false
        default: 'testng-smoke.xml'
        type: choice
        options:
          - testng-smoke.xml
          - testng-regression.xml
          - testng-e2e.xml

defaults:
  run:
    working-directory: FullStack_Projects/LUMASTAY/lumastay-automation

jobs:
  test:
    name: Run ${{ github.event.inputs.suite || 'testng-smoke.xml' }}
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lumastay
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Load database schema and seed data
        working-directory: FullStack_Projects/LUMASTAY/lumastay-backend
        run: |
          npm install
          PGPASSWORD=postgres psql -h localhost -U postgres -d lumastay -f src/db/schema.sql
          npm run seed
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/lumastay

      - name: Start backend server
        working-directory: FullStack_Projects/LUMASTAY/lumastay-backend
        run: |
          npm run dev &
          echo "Waiting for backend on port 4000..."
          until curl -sf http://localhost:4000/health; do sleep 2; done
          echo "Backend is ready"
        env:
          PORT: 4000
          JWT_SECRET: ci_test_secret
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/lumastay
          CORS_ORIGIN: http://localhost:5173
          TAX_RATE: '0.16'

      - name: Build and serve frontend
        working-directory: FullStack_Projects/LUMASTAY/lumastay-frontend
        run: |
          npm install
          npm run build
          npx serve -s dist -l 5173 &
          echo "Waiting for frontend on port 5173..."
          until curl -sf http://localhost:5173; do sleep 2; done
          echo "Frontend is ready"

      - name: Run automation suite
        run: |
          mvn test \
            -Dtestng.suite=${{ github.event.inputs.suite || 'testng-smoke.xml' }} \
            -Dbrowser=chrome \
            -Dheadless=true
        env:
          CI: true

      - name: Generate Allure report
        if: always()
        run: mvn allure:report

      - name: Upload Allure HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: FullStack_Projects/LUMASTAY/lumastay-automation/target/site/allure-maven-plugin
          retention-days: 14

      - name: Upload Surefire XML results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: FullStack_Projects/LUMASTAY/lumastay-automation/target/surefire-reports
          retention-days: 14
